# Local stack — runs the Bake `serve` target on the filesystem backend with the
# dev no-op auth provider. `docker compose up --build` serves the API + live view.
# The host bind defaults to 127.0.0.1:8000; set CLAUDEPLANS_HOST_IP / _HOST_PORT (an
# .env or the shell) to give a stack its own loopback address — e.g. 127.0.0.3:80 +
# an /etc/hosts alias for a friendly portless URL (see ## Local run in the README).
# State lives in the named `data` volume, not the host tree.
name: claudeplans  # stable project name -> stable `claudeplans_data` volume, even if the repo dir moves
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: serve
    image: claudeplans:serve
    ports:
      # Loopback-only by default: the noop auth provider trusts a single fixed `dev`
      # user with no authentication, so the port must not leave this host. A dedicated
      # loopback IP (127.0.0.0/8 is all local on Linux) lets many stacks share :8000 —
      # or take :80 for a portless friendly host — without colliding.
      - "${CLAUDEPLANS_HOST_IP:-127.0.0.1}:${CLAUDEPLANS_HOST_PORT:-8000}:8000"
    environment:
      # Env vars carry the CLAUDEPLANS_ prefix (SettingsConfigDict env_prefix); the
      # bare names are silently ignored and the app boots as the fail-closed iap default.
      CLAUDEPLANS_AUTH_MODE: noop
      CLAUDEPLANS_STORAGE_BACKEND: filesystem
      # The image's WORKDIR /app is not writable by the non-root app user; point the
      # filesystem root at /data, owned by app and backed by the named volume below.
      CLAUDEPLANS_FILESYSTEM__ROOT: /data
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  data:
