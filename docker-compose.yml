# Local stack — runs the Bake `serve` target on the filesystem backend with the
# dev no-op auth provider. `docker compose up --build` serves the API + live view.
# The host bind defaults to 127.0.0.1:8000; the stable stack overrides it via
# CLAUDEPLANS_HOST_IP / _HOST_PORT from its checkout's .env — e.g. 127.0.0.3:80 + an
# /etc/hosts alias for a friendly portless URL — while `make up` forces the dev bind
# 127.0.0.1:9394 in the recipe (see ## Local run in the README).
# State lives in the named `data` volume, not the host tree.
# Default project = the dev stack (own claudeplans-dev_* volumes). The stable stack
# overrides with `-p claudeplans` (make serve) — that project name keys the long-lived
# `claudeplans_data`/`claudeplans_state` volumes holding the real documents.
name: claudeplans-dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: serve
    image: claudeplans:serve
    ports:
      # Loopback-only by default: the noop auth provider trusts a single fixed `dev`
      # user with no authentication, so the port must not leave this host. A dedicated
      # loopback IP (127.0.0.0/8 is all local on Linux) lets many stacks share a port —
      # or take :80 for a portless friendly host — without colliding.
      - "${CLAUDEPLANS_HOST_IP:-127.0.0.1}:${CLAUDEPLANS_HOST_PORT:-8000}:8000"
    environment:
      # Env vars carry the CLAUDEPLANS_ prefix (SettingsConfigDict env_prefix); the
      # bare names are silently ignored and the app boots as the fail-closed iap default.
      CLAUDEPLANS_AUTH_MODE: noop
      CLAUDEPLANS_STORAGE_BACKEND: filesystem
      # Who the noop provider authenticates as. `make up` passes the host user so a
      # uid-deriving CLI matches; unset (e.g. `make serve`) keeps the fixed "dev".
      CLAUDEPLANS_NOOP_UID: ${CLAUDEPLANS_NOOP_UID:-dev}
      # The image's WORKDIR /app is not writable by the non-root app user; point the
      # filesystem root at /data, owned by app and backed by the named volume below.
      CLAUDEPLANS_FILESYSTEM__ROOT: /data
      # Registry files (user + project display names) must sit OUTSIDE the storage
      # root and be both writable and persisted — their own /state volume (the image
      # creates the dir app-owned; see Dockerfile).
      CLAUDEPLANS_REGISTRY_PATH: /state/users.json
      CLAUDEPLANS_PROJECT_REGISTRY_PATH: /state/projects.json
    volumes:
      - data:/data
      - state:/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/healthz")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  data:
  state:
