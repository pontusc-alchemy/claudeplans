[project]
name = "claudeplans"
version = "0.1.0"
description = "Containerized CRUD plan service with a derived live HTML view"
requires-python = ">=3.14,<3.15"
dependencies = [
    "claudeplans-contracts",
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "anyio==4.14.0",
    "markdown==3.10.2",
    "pymdown-extensions==10.21.3",
    "nh3==0.3.6",
    "jinja2==3.1.6",
]

[tool.uv.sources]
claudeplans-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeplans"]
