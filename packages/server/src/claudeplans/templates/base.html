<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · claudeplans</title>
    <link rel="stylesheet" href="/assets/css/app.css">
    <script src="/assets/js/htmx.min.js" defer></script>
    <script src="/assets/js/idiomorph-ext.min.js" defer></script>
    <script src="/assets/js/sse.js" defer></script>
    <script src="/assets/js/ui.js" defer></script>
    <script src="/assets/js/search.js" defer></script>
  </head>
  <body class="md-typeset"{% if sidebar %} data-uid="{{ sidebar.current_uid }}"{% endif %}>
    <div class="layout">
      {% if sidebar %}<aside class="sidebar"><button type="button" class="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button><div class="sidebar-scroll">{% include "_sidebar.html" %}</div></aside>{% endif %}
      <div class="content">{% block content %}{% endblock %}</div>
    </div>
  </body>
</html>
