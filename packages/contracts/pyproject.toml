[project]
name = "claudeplans-contracts"
version = "0.1.0"
description = "Shared models and error/exit-code contracts for claudeplans"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeplans_contracts"]
