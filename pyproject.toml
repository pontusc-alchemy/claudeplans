[project]
name = "claudeplans-workspace"
version = "0"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff==0.15.18",
    "ty==0.0.51",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.ruff]
src = ["packages/contracts/src", "packages/server/src", "packages/cli/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ty.environment]
root = ["./packages/contracts/src", "./packages/server/src", "./packages/cli/src", "./tests/integration"]

[tool.ty.src]
include = ["packages", "tests"]
